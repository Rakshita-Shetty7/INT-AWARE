name: CI

# Continuous integration for INT-AWARE.
# The test suite is fully hermetic (mongomock + mocked Gemini + tempfiles),
# so no MongoDB/network services are required on the runner.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

  dependency-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only for now. Promoted to a blocking gate in ROADMAP Phase 10.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt || true
